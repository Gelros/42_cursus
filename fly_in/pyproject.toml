[project]
name = "fly-in"
version = "0.1.0"
description = "Drone routing simulation — 42 project"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "guillaume" },
]
dependencies = [
    # Terminal colors / rich output for the simulation
    "colorama>=0.4.6",
    "pydantic>=2.13.1",
    "rich>=13.7.0",
]

[dependency-groups]
dev = [
    # Static typing + linting (required by the subject)
    "mypy>=1.11.0",
    "flake8>=7.1.0",
    # Unit tests
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
]
graphical = [
    # Optional graphical renderer
    "pygame>=2.6.0",
]

# Tell uv this is a workspace (no build step — runnable scripts only)
[tool.uv]
package = false

# ──────────────────────────────────────────────────────────────────────────
# mypy configuration
# ──────────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
show_error_codes = true
pretty = true
exclude = [
    "\\.venv",
    "\\.claude",
    "\\.pytest_cache",
    "\\.mypy_cache",
    "build",
    "dist",
]

# ──────────────────────────────────────────────────────────────────────────
# pytest configuration
# ──────────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
